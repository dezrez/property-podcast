<!doctype html>
<html lang="en-gb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI &amp; UK Property — The Daily Briefing</title>
<meta name="description" content="Listen to AI &amp; UK Property: The Daily Briefing — a daily two-host discussion on how AI is changing UK estate agency and conveyancing.">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<a class="skip-link" href="#list">Skip to episodes</a>

<header class="topbar">
  <div class="brand">
    <img class="brand-art" id="brandArt" src="icons/icon-192.png" alt="">
    <div class="brand-text">
      <h1 id="showTitle">AI &amp; UK Property</h1>
      <p id="showSubtitle">The Daily Briefing</p>
    </div>
  </div>
  <div class="topbar-actions">
    <span class="status" id="status" aria-live="polite"></span>
    <button class="icon-btn" id="refreshBtn" title="Refresh feed (R)" aria-label="Refresh feed">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-.6 3M20 4v7h-7"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="Switch theme" aria-label="Switch theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
</header>

<div class="toolbar">
  <div class="search">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search episodes…  (press /)" autocomplete="off" spellcheck="false" aria-label="Search episodes">
    <button class="clear-btn" id="clearSearch" hidden aria-label="Clear search">&times;</button>
  </div>

  <label class="field">
    <span class="field-label">Sort</span>
    <select id="sort" aria-label="Sort episodes">
      <optgroup label="Episode GUID">
        <option value="guid-desc">GUID — newest first</option>
        <option value="guid-asc">GUID — oldest first</option>
      </optgroup>
      <optgroup label="Published">
        <option value="date-desc">Date — newest first</option>
        <option value="date-asc">Date — oldest first</option>
      </optgroup>
      <optgroup label="Other">
        <option value="title-asc">Title A → Z</option>
        <option value="title-desc">Title Z → A</option>
        <option value="size-desc">Largest file first</option>
        <option value="size-asc">Smallest file first</option>
      </optgroup>
    </select>
  </label>

  <label class="switch" title="This feed republishes some episodes under the same GUID. When on, only the most recent version of each GUID is shown.">
    <input type="checkbox" id="dedupe" checked>
    <span class="switch-track"><span class="switch-thumb"></span></span>
    <span class="switch-label">Merge duplicate GUIDs</span>
  </label>

  <span class="count" id="count"></span>
</div>

<main id="list" class="list" tabindex="-1"></main>

<nav class="site-links" aria-label="About this app">
  <a href="privacy.html">Privacy Policy</a>
  <span aria-hidden="true">·</span>
  <a href="terms.html">Terms of Use</a>
  <span aria-hidden="true">·</span>
  <a href="support.html">Support</a>
</nav>

<footer class="player" id="player" hidden>
  <div class="player-seek">
    <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
  </div>
  <div class="player-body">
    <div class="np">
      <img class="np-art" id="npArt" src="icons/icon-192.png" alt="">
      <div class="np-text">
        <strong id="npTitle">—</strong>
        <span id="npTime" class="np-time">0:00 / 0:00</span>
      </div>
    </div>

    <div class="transport">
      <button class="icon-btn skip-btn" id="back15" title="Back 15 seconds (←)" aria-label="Back 15 seconds">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.6 5.12A8 8 0 1 0 13.4 5.12"/>
          <path d="M13.2 2.3 10.4 5.15 13 8"/>
          <text class="skip-num" x="12" y="16">15</text>
        </svg>
      </button>
      <button class="play-btn" id="playPause" title="Play / pause (Space)" aria-label="Play">
        <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5Z"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>
      </button>
      <button class="icon-btn skip-btn" id="fwd30" title="Forward 30 seconds (→)" aria-label="Forward 30 seconds">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M13.4 5.12A8 8 0 1 1 10.6 5.12"/>
          <path d="M10.8 2.3 13.6 5.15 11 8"/>
          <text class="skip-num" x="12" y="16">30</text>
        </svg>
      </button>
    </div>

    <div class="player-extras">
      <button class="chip" id="speedBtn" title="Playback speed" aria-label="Playback speed">1&times;</button>
      <div class="volume">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="vol-icon"><path d="M4 9v6h4l5 4V5L8 9H4zM17 9a4 4 0 0 1 0 6"/></svg>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>
      <button class="icon-btn" id="closePlayer" title="Close player" aria-label="Close player">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
</footer>

<audio id="audio" preload="metadata"></audio>

<script src="app.js"></script>
</body>
</html>
